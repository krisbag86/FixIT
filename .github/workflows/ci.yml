name: CI

on:
  push:
    branches: [main, codex/v1.2]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: 20.20.2

jobs:
  validate:
    name: Typecheck, lint, tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fixit
          POSTGRES_USER: fixit
          POSTGRES_PASSWORD: fixit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Migrate test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://fixit:fixit@localhost:5432/fixit
      - name: Seed test database
        run: npm run db:seed
        env:
          DATABASE_URL: postgresql://fixit:fixit@localhost:5432/fixit
      - run: npm run typecheck
      - run: npm run lint
      - name: Run unit + PostgreSQL integration tests
        run: npm run test
        env:
          DATABASE_URL: postgresql://fixit:fixit@localhost:5432/fixit
      - run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
